;
; CH32H417 gamepad input-latency tester (CH32H417QEU6-EVT R0)
;
; Three images:
;   lat_bl   Bootloader. Flash 0x00000-0x0DFFF (56KB). Runs on V3F only.
;   lat_v3f  V3F app. Flash 0x10000-0x2FFFF (128KB), runs from RAM_CODE (64KB).
;   lat_v5f  V5F app. Flash 0x30000-0x6FFFF (256KB), runs from ITCM (128KB).
; Shared SRAM layout: ldscripts/*.ld.
;
; Build with tools/build_all.sh (includes placement checks and image generation).
;

[platformio]
default_envs =
    lat_bl
    lat_v3f
    lat_v5f

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#0dbf478ff952bb7096700c729b5798a850cae1f0
framework = noneos-sdk
platform_packages =
    framework-wch-noneos-sdk @ https://github.com/Community-PIO-CH32V/framework-wch-noneos-sdk.git#113a1d30a0d96d608d25dff309fd484040ec4754
board_build.use_builtin_system_files = true
; All envs use SYSCLK_400M_CoreCLK_V5F_400M_V3F_100M_HSE (V5F=400MHz, V3F=HCLK=100MHz).
board_build.clock_source = hse+pll
board_build.f_cpu = 400000000L
monitor_speed = 115200
; The platform appends its default -std=gnu99 and -Os after build_flags,
; so they must be removed for -std=gnu11 and -O2 to take effect.
build_unflags =
    -Os
    -std=gnu99
build_flags =
    -std=gnu11
    -O2
    -flto
    -Isrc/shared

; ---- Bootloader (V3F only) ----
[env:lat_bl]
board = genericCH32H417QEU6_V3F
build_src_filter =
    +<boot/>
    +<shared/boot_magic.c>
    +<shared/lat_uart.c>
    +<shared/usbfs_dev.c>
board_build.ldscript = ldscripts/Link_CH32H417_bl.ld

; ---- V3F app (PC link, UART log, V5F start) ----
[env:lat_v3f]
board = genericCH32H417QEU6_V3F
build_src_filter =
    +<v3f/>
    +<shared/>
board_build.ldscript = ldscripts/Link_CH32H417_v3f.ld

; ---- V5F app (TIM9 time base, USBHS host, measurement) ----
; V5F uses hard float (the board default is soft float).
; Linker relaxation is disabled because gp-relative relaxation can mis-resolve
; references that cross ITCM and DTCM.
; Do not use -Wl,--noinhibit-exec: it hides region overflows.
; RAM limit is ITCM 128KB + DTCM 256KB = 384KB (the board definition counts ITCM only).
[env:lat_v5f]
board = genericCH32H417QEU6_V5F
board_build.march = rv32imafc_zba_zbb_zbc_zbs_xw
board_build.mabi = ilp32f
build_unflags =
    ${env.build_unflags}
    -Wl,--relax
build_flags =
    ${env.build_flags}
    -Wl,--no-relax
    -Isrc/v5f
board_upload.maximum_ram_size = 393216
; Merge LTO into one partition (avoids lto-wrapper warnings).
extra_scripts = post:tools/pio_v5f_lto.py
; V5F has no UART or USBFS and does not route interrupts.
build_src_filter =
    +<v5f/>
    +<shared/>
    -<shared/lat_uart.c>
    -<shared/irq_route.c>
    -<shared/usbfs_dev.c>
board_build.ldscript = ldscripts/Link_CH32H417_v5f.ld
